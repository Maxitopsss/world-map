name: build hmod

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: install cargo-horizon-mod
        run: cargo install --locked --git https://github.com/horizon-rust/horizon cargo-horizon-mod

      - name: build .hmod
        run: cargo horizon-mod build

      - name: check .hmod
        run: cargo horizon-mod check target/horizon-mod/world_map.hmod

      - uses: actions/upload-artifact@v4
        with:
          name: world-map-hmod
          path: target/horizon-mod/*.hmod

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: world-map-hmod
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.hmod'
